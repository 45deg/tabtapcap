<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Tab Transcriber</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <div class="title-row">
        <h1>文字起こし</h1>
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
      </div>
      <p id="status" role="status">サーバーを確認しています…</p>
      <p id="detail" class="detail"></p>
      <section id="recording-panel" class="recording-panel" aria-label="録音状態" hidden>
        <div id="recording-meter" class="recording-meter" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <time id="elapsed" datetime="PT0S">0:00</time>
      </section>
      <button id="primary" type="button" disabled>開始</button>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
