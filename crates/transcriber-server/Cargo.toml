[package]
name = "tabtapcap-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["static"] }
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal", "tracing_backend"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan", "tracing_backend"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
whisper-rs = { version = "0.16", features = ["tracing_backend"] }

[dev-dependencies]
tempfile = "3"
