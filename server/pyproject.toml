[project]
name = "local-tab-transcriber-server"
version = "0.1.0"
description = "Local-only transcription server for Chrome tab audio"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.3,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
transcription = [
  "faster-whisper>=1.2,<2",
  "huggingface-hub>=0.34,<2",
]
diarization = [
  "huggingface-hub>=0.34,<2",
  "pyannote.audio>=4,<5",
]
ml = [
  "faster-whisper>=1.2,<2",
  "huggingface-hub>=0.34,<2",
  "pyannote.audio>=4,<5",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
local-transcriber = "local_transcriber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_transcriber"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
